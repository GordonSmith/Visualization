<!doctype html>
<html>

<head>
    <title>@hpcc-js/marshaller</title>
    <style>
        body {
            padding: 0px;
            margin: 8px;
            overflow: hidden;
        }

        #placeholder {
            width: 100%;
            height: 100vh;
        }
    </style>
    <script type="module">
        import "@hpcc-js/common/font-awesome/css/font-awesome.min.css";
    </script>
</head>

<body>
    <div id="placeholder"></div>
    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get("mode") || "dashboard";

        if (mode === "dashy") {
            const { loadDashy } = await import("./tests/dashy-demo.ts");
            loadDashy("placeholder");
        } else if (mode === "dashPOC") {
            const { loadDashboard } = await import("./tests/dashPOC.ts");
            loadDashboard("placeholder");
        } else {
            const { loadDashboard } = await import("./tests/dashy-demo.ts");
            loadDashboard("placeholder");
        }
    </script>
</body>

</html>
