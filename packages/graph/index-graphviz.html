<!doctype html>
<html>

<head>
    <title>Pure Graphviz Demo</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f8;
            color: #222;
        }

        header {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        header span {
            opacity: 0.6;
            font-size: 0.85rem;
        }

        .panels {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: calc(100vh - 56px);
        }

        .panel {
            position: relative;
            overflow: hidden;
        }

        .panel-label {
            position: absolute;
            top: 8px;
            left: 12px;
            z-index: 10;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 3px;
            pointer-events: none;
        }

        .panel-light .panel-label {
            background: rgba(0, 0, 0, 0.06);
            color: #555;
        }

        .panel-dark .panel-label {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
        }

        .panel-light {
            color-scheme: light;
            background: #fff;
        }

        .panel-dark {
            color-scheme: dark;
            background: #1a1a2e;
        }

        #graph-light,
        #graph-dark {
            width: 100%;
            height: 100%;
        }

        .graph_GraphvizWidget.graph_GraphvizWidget {
            --gv-running-stroke: light-dark(#ff5900, #ffa726);
            --gv-running-fill: light-dark(#ffdca2, #3a2a1b);
        }
    </style>
    <script type="module">
        import "@hpcc-js/common/font-awesome/css/font-awesome.min.css";
    </script>
</head>

<body>
    <header>
        <h1>Pure Graphviz Widget</h1>
        <span>Light &amp; Dark</span>
    </header>

    <div class="panels">
        <div class="panel panel-light">
            <div class="panel-label">Light</div>
            <div id="graph-light"></div>
        </div>
        <div class="panel panel-dark">
            <div class="panel-label">Dark</div>
            <div id="graph-dark"></div>
        </div>
    </div>

    <script type="module">
        import { Test7, Test8 } from "./tests/index.ts";

        const light = new Test7()
            .target("graph-light")
            .render()
            ;

        const dark = new Test8()
            .target("graph-dark")
            .render()
            ;

        window.addEventListener("resize", () => {
            light.resize().render();
            dark.resize().render();
        });
    </script>
</body>

</html>
